# =============================================================================
# Enterprise Legal Document Intelligence AI
# File: monitoring/prometheus/prometheus.yml
# =============================================================================

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 30s

  external_labels:
    project: enterprise-legal-document-intelligence-ai
    environment: ${ENVIRONMENT}

# =============================================================================
# Alert Rules
# =============================================================================

rule_files:
  - /etc/prometheus/rules/application-alerts.yaml
  - /etc/prometheus/rules/model-alerts.yaml
  - /etc/prometheus/rules/security-alerts.yaml

# =============================================================================
# Alertmanager
# =============================================================================

alerting:
  alertmanagers:
    - scheme: http
      static_configs:
        - targets:
            - alertmanager:9093

      timeout: 10s

# =============================================================================
# Scrape Configurations
# =============================================================================

scrape_configs:

  # ===========================================================================
  # Prometheus Self Monitoring
  # ===========================================================================

  - job_name: prometheus
    metrics_path: /metrics

    static_configs:
      - targets:
          - localhost:9090

        labels:
          service: prometheus
          component: monitoring

  # ===========================================================================
  # FastAPI Backend
  # ===========================================================================

  - job_name: legal-ai-backend

    metrics_path: /metrics
    scheme: http

    scrape_interval: 15s
    scrape_timeout: 10s

    static_configs:
      - targets:
          - backend:8000

        labels:
          service: legal-ai-backend
          component: api
          application: legal-document-intelligence

  # ===========================================================================
  # ML Model Serving
  # ===========================================================================

  - job_name: legal-ai-model-serving

    metrics_path: /metrics
    scheme: http

    scrape_interval: 15s

    static_configs:
      - targets:
          - model-serving:8001

        labels:
          service: legal-ai-model-serving
          component: machine-learning

  # ===========================================================================
  # RAG Service
  # ===========================================================================

  - job_name: legal-ai-rag

    metrics_path: /metrics
    scheme: http

    static_configs:
      - targets:
          - rag-service:8002

        labels:
          service: legal-ai-rag
          component: retrieval-augmented-generation

  # ===========================================================================
  # Agent Service
  # ===========================================================================

  - job_name: legal-ai-agents

    metrics_path: /metrics
    scheme: http

    static_configs:
      - targets:
          - agent-service:8003

        labels:
          service: legal-ai-agents
          component: agentic-ai

  # ===========================================================================
  # Document Processing Workers
  # ===========================================================================

  - job_name: legal-ai-document-workers

    metrics_path: /metrics
    scheme: http

    static_configs:
      - targets:
          - document-worker-exporter:9101

        labels:
          service: legal-ai-document-workers
          component: document-processing

  # ===========================================================================
  # Celery Monitoring Exporter
  # ===========================================================================

  - job_name: celery

    metrics_path: /metrics
    scheme: http

    static_configs:
      - targets:
          - celery-exporter:9808

        labels:
          service: celery
          component: background-tasks

  # ===========================================================================
  # PostgreSQL Exporter
  # ===========================================================================

  - job_name: postgres

    metrics_path: /metrics
    scheme: http

    static_configs:
      - targets:
          - postgres-exporter:9187

        labels:
          service: postgresql
          component: database

  # ===========================================================================
  # Redis Exporter
  # ===========================================================================

  - job_name: redis

    metrics_path: /metrics
    scheme: http

    static_configs:
      - targets:
          - redis-exporter:9121

        labels:
          service: redis
          component: cache

  # ===========================================================================
  # Node Exporter
  # ===========================================================================

  - job_name: node-exporter

    metrics_path: /metrics
    scheme: http

    static_configs:
      - targets:
          - node-exporter:9100

        labels:
          service: node-exporter
          component: infrastructure

  # ===========================================================================
  # cAdvisor - Docker Container Metrics
  # ===========================================================================

  - job_name: cadvisor

    metrics_path: /metrics
    scheme: http

    static_configs:
      - targets:
          - cadvisor:8080

        labels:
          service: cadvisor
          component: containers

  # ===========================================================================
  # Kubernetes State Metrics
  # ===========================================================================

  - job_name: kube-state-metrics

    metrics_path: /metrics
    scheme: http

    static_configs:
      - targets:
          - kube-state-metrics:8080

        labels:
          service: kube-state-metrics
          component: kubernetes

  # ===========================================================================
  # Model Registry
  # ===========================================================================

  - job_name: legal-ai-model-registry

    metrics_path: /metrics
    scheme: http

    static_configs:
      - targets:
          - model-registry:8004

        labels:
          service: legal-ai-model-registry
          component: mlops

  # ===========================================================================
  # Security Monitoring
  # ===========================================================================

  - job_name: legal-ai-security

    metrics_path: /metrics
    scheme: http

    static_configs:
      - targets:
          - security-service:8005

        labels:
          service: legal-ai-security
          component: security

  # ===========================================================================
  # OCR Service
  # ===========================================================================

  - job_name: legal-ai-ocr

    metrics_path: /metrics
    scheme: http

    static_configs:
      - targets:
          - ocr-service:8006

        labels:
          service: legal-ai-ocr
          component: ocr

  # ===========================================================================
  # Embedding Service
  # ===========================================================================

  - job_name: legal-ai-embeddings

    metrics_path: /metrics
    scheme: http

    static_configs:
      - targets:
          - embedding-service:8007

        labels:
          service: legal-ai-embeddings
          component: embeddings

  # ===========================================================================
  # Reranker Service
  # ===========================================================================

  - job_name: legal-ai-reranker

    metrics_path: /metrics
    scheme: http

    static_configs:
      - targets:
          - reranker-service:8008

        labels:
          service: legal-ai-reranker
          component: reranking

  # ===========================================================================
  # Alertmanager Monitoring
  # ===========================================================================

  - job_name: alertmanager

    metrics_path: /metrics
    scheme: http

    static_configs:
      - targets:
          - alertmanager:9093

        labels:
          service: alertmanager
          component: monitoring

  # ===========================================================================
  # Loki Monitoring
  # ===========================================================================

  - job_name: loki

    metrics_path: /metrics
    scheme: http

    static_configs:
      - targets:
          - loki:3100

        labels:
          service: loki
          component: logging

# =============================================================================
# End of Prometheus Configuration
# =============================================================================