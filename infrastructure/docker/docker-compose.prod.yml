version: '3.8'

# ==============================================================================
# Enterprise Legal Document Intelligence AI
# Production Docker Compose Configuration
# ==============================================================================

services:

  # ----------------------------------------------------------------------------
  # Database - PostgreSQL with pgvector
  # ----------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg15
    container_name: legal-ai-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-legal_ai}
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Database password required}
      POSTGRES_INITDB_ARGS: "-E UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "5432:5432"
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G

  # ----------------------------------------------------------------------------
  # Cache - Redis
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: legal-ai-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:?Redis password required} --maxmemory 2gb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  # ----------------------------------------------------------------------------
  # API Service
  # ----------------------------------------------------------------------------
  api:
    image: legal-ai-api:${VERSION:-latest}
    container_name: legal-ai-api
    restart: always
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile.api
    environment:
      # Application
      APP_NAME: legal-ai
      APP_ENV: production
      APP_DEBUG: "false"
      APP_PORT: 8000
      
      # Database
      DATABASE_URL: postgresql://${DB_USER:-admin}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-legal_ai}
      
      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      
      # AI Models
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      HF_TOKEN: ${HF_TOKEN}
      DEFAULT_LLM_PROVIDER: ${DEFAULT_LLM_PROVIDER:-openai}
      
      # Storage
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      
      # Security
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT secret required}
      SECRET_KEY: ${SECRET_KEY:?Secret key required}
      
      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      
      # OCR
      ENABLE_OCR: ${ENABLE_OCR:-true}
      OCR_LANGUAGE: ${OCR_LANGUAGE:-eng}
      
      # Monitoring
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENABLE_METRICS: "true"
      
    volumes:
      - api_logs:/app/logs
      - documents:/app/storage/documents
      - models:/app/ml-models
    ports:
      - "8000:8000"
    networks:
      - legal-ai-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  # ----------------------------------------------------------------------------
  # Worker Service (Background Tasks)
  # ----------------------------------------------------------------------------
  worker:
    image: legal-ai-worker:${VERSION:-latest}
    container_name: legal-ai-worker
    restart: always
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile.worker
    environment:
      # Celery
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      
      # Database
      DATABASE_URL: postgresql://${DB_USER:-admin}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-legal_ai}
      
      # Same environment as API
      APP_ENV: production
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      ENABLE_OCR: ${ENABLE_OCR:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      
    volumes:
      - worker_logs:/app/logs
      - documents:/app/storage/documents
      - models:/app/ml-models
    networks:
      - legal-ai-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G

  # ----------------------------------------------------------------------------
  # Model Service (ML Inference)
  # ----------------------------------------------------------------------------
  model:
    image: legal-ai-model:${VERSION:-latest}
    container_name: legal-ai-model
    restart: always
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile.model
    environment:
      MODEL_DEVICE: ${MODEL_DEVICE:-cpu}
      MODEL_PRECISION: ${MODEL_PRECISION:-float32}
      MODEL_BATCH_SIZE: ${MODEL_BATCH_SIZE:-32}
      HF_TOKEN: ${HF_TOKEN}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - models:/app/ml-models
      - model_cache:/root/.cache
    ports:
      - "8100:8100"
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 16G
        reservations:
          cpus: '4'
          memory: 8G

  # ----------------------------------------------------------------------------
  # Frontend - React UI
  # ----------------------------------------------------------------------------
  ui:
    image: legal-ai-ui:${VERSION:-latest}
    container_name: legal-ai-ui
    restart: always
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile.ui
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:8000}
    ports:
      - "3000:80"
    networks:
      - legal-ai-network
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  # ----------------------------------------------------------------------------
  # Nginx - Reverse Proxy & Load Balancer
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: legal-ai-nginx
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    ports:
      - "80:80"
      - "443:443"
    networks:
      - legal-ai-network
    depends_on:
      - api
      - ui
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ----------------------------------------------------------------------------
  # Prometheus - Metrics Collection
  # ----------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: legal-ai-prometheus
    restart: always
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - legal-ai-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  # ----------------------------------------------------------------------------
  # Grafana - Metrics Visualization
  # ----------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: legal-ai-grafana
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Grafana password required}
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3001:3000"
    networks:
      - legal-ai-network
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # ----------------------------------------------------------------------------
  # Elasticsearch - Logging
  # ----------------------------------------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: legal-ai-elasticsearch
    restart: always
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms2g -Xmx2g"
      - xpack.security.enabled=false
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - legal-ai-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G

  # ----------------------------------------------------------------------------
  # Kibana - Log Visualization
  # ----------------------------------------------------------------------------
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: legal-ai-kibana
    restart: always
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    networks:
      - legal-ai-network
    depends_on:
      - elasticsearch
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

# ==============================================================================
# Networks
# ==============================================================================
networks:
  legal-ai-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16

# ==============================================================================
# Volumes
# ==============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  api_logs:
    driver: local
  worker_logs:
    driver: local
  nginx_logs:
    driver: local
  documents:
    driver: local
  models:
    driver: local
  model_cache:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  elasticsearch_data:
    driver: local
